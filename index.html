<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙４クイズ - メニュー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .font-info { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 md:p-8">
    <div class="text-center mb-6">
      <span class="inline-block bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs tracking-wider uppercase mb-2">わな猟免許クイズ</span>
      <h1 class="text-2xl font-extrabold text-slate-800">挑戦するジャンルを選んでね
      </h1>
    </div>

    <!-- 4つのボタンの上に小さく「test1」を表示 -->
    <div class="text-xs font-bold text-slate-400 mb-2">１．模擬試験（筆記）</div>

    <div class="grid grid-cols-1 gap-4">
      <a href="quiz.html?mode=questions_hazmat_mock_exam_1" class="group flex items-center justify-between p-4 bg-gradient-to-r from-red-500 to-rose-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
        <div class="text-left">
          <div class="font-extrabold text-lg">法令(15問)</div>
          <div class="text-xs text-white/80">本番15問</div>
        </div>
        <i class="fa-solid fa-chevron-right text-white/60 group-hover:text-white group-hover:translate-x-1 transition-all"></i>
      </a>

      <a href="quiz.html?mode=questions_hazmat_mock_exam_1" class="group flex items-center justify-between p-4 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
        <div class="text-left">
          <div class="font-extrabold text-lg">基礎的な物理・化学(10問)</div>
          <div class="text-xs text-white/80">本番10問</div>
        </div>
        <i class="fa-solid fa-chevron-right text-white/60 group-hover:text-white group-hover:translate-x-1 transition-all"></i>
      </a>

      <a href="quiz.html?mode=questions_hazmat_mock_exam_1" class="group flex items-center justify-between p-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
        <div class="text-left">
          <div class="font-extrabold text-lg">消化方法(10問)</div>
          <div class="text-xs text-white/80">本番10問</div>
        </div>
        <i class="fa-solid fa-chevron-right text-white/60 group-hover:text-white group-hover:translate-x-1 transition-all"></i>
      </a>
    <div class="text-xs font-bold text-slate-800 text-right my-1">出典：赤本</div>


    <!-- 試験概要の追記セクション -->
    <hr class="border-t-2 border-dotted border-slate-300 my-1">

    <div class="font-info text-xs text-slate-600 bg-slate-50 rounded-2xl p-4 space-y-4 leading-relaxed border border-slate-200/70">
      <div>
        <div class="font-bold text-slate-700 mb-2">危険物乙種４類試験概要</div>
        <div class="font-bold text-slate-700 mb-1">知識試験（筆記120分・５択マークシート35問）</div>
        <ul class="space-y-0.5 pl-1">
          <li>- 合格基準：各分野正答率60%以上</li>
          <li>① 法令：15問（12問以上の正解で合格）</li>
          <li>② 基礎的な物理・化学：10問（6問以上の正解で合格）</li>
          <li>③ 鳥獣に関する知識問：10問（6問以上の正解で合格）</li>
        </ul>
      </div>
    </div>

  </div>

</body>
</html>
